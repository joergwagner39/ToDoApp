<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Spieler & Privat ToDo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  /* Layout: sticky Kopfzeile mit Umschalter Beruflich/Privat, darunter Kennzahlen, Kachelraster + Seitenleiste */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-2: #f6f8fb;
    --border: #e0e5ec;
    --text: #18202b;
    --muted: #667085;
    --accent: #2457d6;
    --accent-soft: #e7eefe;
    --on-accent: #ffffff;
    --privat: #7c3aed;
    --privat-soft: #f1eafe;
    --amp-rot: #e03131;
    --amp-gelb: #f0a500;
    --amp-gruen: #2f9e44;
    --danger: #c92a2a;
    --danger-soft: #fdeaea;
    --warn: #b86a00;
    --warn-soft: #fdf2df;
    --ok: #1f9d55;
    --star: #d99a00;
    --overlay: rgba(16, 24, 40, .45);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --radius: 12px;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141a; --surface: #181d25; --surface-2: #1f252e; --border: #2b333e;
      --text: #e6eaf0; --muted: #98a2b3; --accent: #7aa2ff; --accent-soft: #1c2945; --on-accent: #0d1424;
      --privat: #b197fc; --privat-soft: #2a2140; --amp-rot: #ff6b6b; --amp-gelb: #ffc531; --amp-gruen: #51cf66; --danger: #f87171; --danger-soft: #3a1e1e;
      --warn: #fbbf24; --warn-soft: #3a2d14; --ok: #4ade80; --star: #fcc419; --overlay: rgba(0,0,0,.6);
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141a; --surface: #181d25; --surface-2: #1f252e; --border: #2b333e;
    --text: #e6eaf0; --muted: #98a2b3; --accent: #7aa2ff; --accent-soft: #1c2945; --on-accent: #0d1424;
    --privat: #b197fc; --privat-soft: #2a2140; --amp-rot: #ff6b6b; --amp-gelb: #ffc531; --amp-gruen: #51cf66; --danger: #f87171; --danger-soft: #3a1e1e;
    --warn: #fbbf24; --warn-soft: #3a2d14; --ok: #4ade80; --star: #fcc419; --overlay: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- Header ---------- */
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top-inner { padding-block: 10px; display: flex; align-items: center; gap: 12px; position: relative; }
  .brand { font-family: var(--font-head); font-weight: 700; font-size: 18px; margin-right: auto; display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .sync { font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .sync.ok i { background: var(--ok); }
  .sync.busy i { background: var(--warn); }
  .sync.err i { background: var(--danger); }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tab .count { font-size: 12px; background: var(--border); color: var(--text); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
  .tab.active.beruf { background: var(--accent); color: var(--on-accent); }
  .tab.active.privat { background: var(--privat); color: var(--on-accent); }
  .tab.active .count { background: rgba(255,255,255,.25); color: inherit; }
  .menu-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .menu { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; z-index: 20; width: 260px; max-width: calc(100vw - 32px); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--surface-2); }
  .menu .note { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; border-top: 1px solid var(--border); margin-top: 4px; }

  main.wrap { padding-block: 20px 60px; }
  h1 { font-family: var(--font-head); font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; text-wrap: balance; }
  h2 { font-family: var(--font-head); font-size: 17px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .v { font-family: var(--font-head); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.danger .v { color: var(--danger); }
  .stat.warn .v { color: var(--warn); }

  /* ---------- Controls ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; min-width: 180px; width: auto; }
  .input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); outline: none; min-width: 0; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 9px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .privat-page .btn.primary { background: var(--privat); border-color: var(--privat); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.danger { color: var(--danger); }
  .btn.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }

  /* ---------- Player tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; box-shadow: var(--shadow); text-decoration: none; display: flex; flex-direction: column; gap: 12px; transition: transform .12s ease, border-color .12s ease; }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tile.is-fav { border-color: color-mix(in srgb, var(--star) 55%, var(--border)); }
  .star { margin-left: auto; align-self: flex-start; border: 0; background: transparent; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 4px; border-radius: 6px; }
  .star:hover { background: var(--surface-2); color: var(--star); }
  .star.on { color: var(--star); }
  .tile.sorting { cursor: grab; transform: none; border-style: dashed; }
  .tile.dragging { opacity: .45; }
  .tile.drop-target { border-color: var(--accent); border-style: solid; }
  .mover { margin-left: auto; display: flex; gap: 4px; align-self: flex-start; }
  .mover button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; width: 34px; height: 32px; cursor: pointer; font-weight: 700; color: var(--text); }
  .mover button:hover { border-color: var(--accent); color: var(--accent); }
  .btn.fav-on { color: var(--star); border-color: var(--star); }
  .stack { display: grid; gap: 20px; min-width: 0; }
  .stack .toolbar { margin-bottom: 0; }
  h2.sec { display: flex; align-items: center; gap: 8px; }
  h2.sec span, .sec-toggle > span:not(.chev):not(.pill) { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-family: var(--font-body); }
  .sec-toggle { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px dashed var(--border); background: transparent; border-radius: var(--radius); padding: 10px 14px; cursor: pointer; font-family: var(--font-head); font-weight: 700; font-size: 16px; margin-bottom: 12px; text-align: left; }
  .sec-toggle:hover { background: var(--surface); }
  .sec-toggle .chev { color: var(--muted); width: 12px; }
  .hint { margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--text); font-size: 13.5px; }
  .h-note { font-family: var(--font-body); font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .avatar.other { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
  .tile-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; }
  .tile-name { font-weight: 700; line-height: 1.2; min-width: 0; }
  .tile-name small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
  .tile-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill.open { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.over { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .areas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .area-dot { text-align: center; font-size: 10px; color: var(--muted); }
  .area-dot i { display: block; height: 5px; border-radius: 3px; background: var(--border); margin-bottom: 3px; }
  .area-dot.full i { background: var(--ok); }
  .area-dot.part i { background: var(--warn); }
  .area-dot.has-todo { color: var(--accent); font-weight: 700; }

  /* ---------- Todo list ---------- */
  .add-form { display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px auto auto; gap: 8px; margin-bottom: 14px; }
  .prio-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 600; user-select: none; background: var(--surface); }
  .prio-toggle input { accent-color: var(--danger); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: var(--surface); padding: 4px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .todos { list-style: none; margin: 0; padding: 0; }
  .todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .todo:last-child { border-bottom: 0; }
  .todo input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
  .privat-page .todo input[type=checkbox] { accent-color: var(--privat); }
  .todo-text { overflow-wrap: anywhere; cursor: text; }
  .todo.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-sub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .tag.due.over { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .tag.due.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.prio { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 16px; opacity: .55; }
  .todo:hover .icon-btn, .icon-btn:focus { opacity: 1; }
  .icon-btn:hover { background: var(--surface-2); color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 14px; }
  .edit-input { width: 100%; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); }

  /* ---------- Player detail ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
  .back:hover { color: var(--text); }
  .player-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .player-head .avatar { width: 60px; height: 60px; font-size: 21px; }
  .player-head .grow { flex: 1; min-width: 200px; }
  .progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 8px; max-width: 320px; }
  .progress b { display: block; height: 100%; background: var(--ok); }
  .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; align-items: start; }
  .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .info-card summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .info-card summary::-webkit-details-marker { display: none; }
  .info-card .ic { font-size: 20px; }
  .info-card .t { font-weight: 700; flex: 1; min-width: 0; }
  .info-card .t small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .info-card .chev { color: var(--muted); transition: transform .15s; }
  .info-card[open] .chev { transform: rotate(90deg); }
  .info-body { padding: 12px 14px 14px; display: grid; gap: 8px; border-top: 1px solid var(--border); }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .field .input { padding: 7px 10px; }
  textarea.input { resize: vertical; min-height: 60px; }
  .status { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex: none; }
  .status.full { background: var(--ok); }
  .status.part { background: var(--warn); }
  .info-open-todos { color: var(--accent); font-weight: 600; }

  /* ---------- Upcoming ---------- */
  .up-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); text-decoration: none; }
  .up-item .avatar { width: 30px; height: 30px; font-size: 11px; }
  .up-item .x { flex: 1; min-width: 0; }
  .up-item .x div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-item .x small { color: var(--muted); }

  /* ---------- Private groups ---------- */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .group h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .group h3 .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }

  /* ---------- Modal ---------- */
  .modal-back { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0; font-family: var(--font-head); font-size: 18px; }
  .modal p { margin: 0; color: var(--muted); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .modal { max-height: calc(100dvh - 32px); overflow-y: auto; }
  .dlg-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlg-fields .field { grid-column: 1 / -1; min-width: 0; }
  .dlg-fields .field.half { grid-column: auto; }

  /* ---------- Startseite / Ampel ---------- */
  .tab.active.start { background: var(--text); color: var(--surface); }
  .amp-light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex: none; vertical-align: 1px; margin-right: 7px; }
  .amp-light.rot { background: var(--amp-rot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amp-rot) 22%, transparent); }
  .amp-light.gelb { background: var(--amp-gelb); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amp-gelb) 22%, transparent); }
  .amp-light.gruen { background: var(--amp-gruen); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amp-gruen) 22%, transparent); }
  .ampel-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .amp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-top: 4px solid var(--border); min-width: 0; }
  .amp-card.rot { border-top-color: var(--amp-rot); }
  .amp-card.gelb { border-top-color: var(--amp-gelb); }
  .amp-card.gruen { border-top-color: var(--amp-gruen); }
  .amp-card .amp-light { width: 14px; height: 14px; margin: 0; }
  .amp-card .v { font-family: var(--font-head); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .amp-card .l { color: var(--muted); font-size: 13px; }
  .amp-card .split { margin-left: auto; display: grid; gap: 2px; font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .split .beruf { color: var(--accent); } .split .privat { color: var(--privat); }
  .st-tools { display: grid; gap: 12px; margin-bottom: 16px; }
  .quick-add { display: grid; grid-template-columns: minmax(0, 1fr) 210px 150px auto auto; gap: 8px; }
  .st-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .ampel-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .amp-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; min-width: 0; }
  .amp-col h2 { display: flex; align-items: center; margin: 0; font-size: 16px; }
  .amp-col h2 .n { margin-left: auto; font-size: 12px; color: var(--muted); font-family: var(--font-body); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .amp-col.rot { background: color-mix(in srgb, var(--amp-rot) 5%, var(--surface)); border-color: color-mix(in srgb, var(--amp-rot) 30%, var(--border)); }
  .amp-hint { margin: 2px 0 10px; font-size: 12px; color: var(--muted); }
  .st-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .st-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); border-left: 4px solid var(--accent); background: var(--surface); transition: opacity .2s, transform .2s; }
  .st-item.privat { border-left-color: var(--privat); }
  .st-item.leaving { opacity: 0; transform: translateX(8px); }
  .st-item input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent); cursor: pointer; }
  .st-item.privat input { accent-color: var(--privat); }
  .st-text { overflow-wrap: anywhere; font-weight: 500; }
  .imp { color: var(--amp-rot); }
  .tag.kind { border-color: transparent; text-decoration: none; }
  .tag.kind.beruf { background: var(--accent-soft); color: var(--accent); }
  .tag.kind.privat { background: var(--privat-soft); color: var(--privat); }
  .legend li { display: flex; align-items: center; font-size: 13px; }
  .sw { width: 14px; height: 10px; border-radius: 3px; margin-right: 8px; background: var(--accent); }

<script>
/* =========================================================
   Daten & Konfiguration
   ========================================================= */
const STORAGE_KEY = 'todoapp.v1';

const PLAYERS = [
  ['Eric Maxim', 'Choupo-Moting'], ['Noah', 'Katterbach'], ['Umut', 'Tohumcu'], ['Kelven', 'Frees'],
  ['Franjo', 'Ivanovic'], ['Bambasé', 'Conté'], ['Fisnik', 'Asllani'],
  ['Guilherme', 'Ramos'], ['Elias', 'Benkara'], ['David', 'Wurie'], ['Rayan', 'Zidane'],
  ['Salvatore', 'Mule'], ['Yasin', 'Chebil'], ['Raif', 'Adam'], ['Malik', 'Kassassir'], ['Piet', 'Scobel'],

const AREAS = [
  { key: 'versicherung', label: 'Versicherungen', short: 'Vers.', icon: '🛡️', fields: [
    ['kranken', 'Krankenversicherung'], ['haftpflicht', 'Haftpflicht'],
    ['bu', 'Berufsunfähigkeit / Sportinvalidität'], ['hausrat', 'Hausrat'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'wohnung', label: 'Wohnung', short: 'Whg.', icon: '🏢', fields: [
    ['status', 'Status (Miete / Eigentum / Suche)'], ['vermieter', 'Vermieter / Makler'],
    ['miete', 'Miete / Kosten'], ['vertrag', 'Vertragsbeginn / Kündigungsfrist'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'adresse', label: 'Adresse & Kontakt', short: 'Adr.', icon: '📍', fields: [
    ['strasse', 'Straße & Hausnr.'], ['ort', 'PLZ & Ort'], ['telefon', 'Telefon'], ['email', 'E-Mail'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'steuer', label: 'Steuer', short: 'Steuer', icon: '🧾', fields: [
    ['berater', 'Steuerberater'], ['steuerid', 'Steuer-ID'], ['finanzamt', 'Finanzamt'],
    ['erklaerung', 'Letzte Steuererklärung'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'auto', label: 'Auto', short: 'Auto', icon: '🚗', fields: [
    ['fahrzeug', 'Fahrzeug'], ['kennzeichen', 'Kennzeichen'], ['vertrag', 'Leasing / Kauf (bis)'],
    ['tuev', 'TÜV / Service fällig'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'familie', label: 'Familie', short: 'Fam.', icon: '👨‍👩‍👧', fields: [
    ['partner', 'Partner/in'], ['kinder', 'Kinder'], ['eltern', 'Eltern / Angehörige'],
    ['notfall', 'Notfallkontakt'], ['notiz', 'Notizen', 'area'] ] },
];
const PLAYER_CATS = [{ key: 'allgemein', label: 'Allgemein', icon: '📌' }, ...AREAS, { key: 'sonstiges', label: 'Sonstiges', icon: '✨' }];

// Sonstige berufliche Aufgaben (keinem Spieler zugeordnet)
const BERUF_CATS = [
  { key: 'allgemein', label: 'Allgemein', icon: '📌' },
  { key: 'termine', label: 'Termine', icon: '📅' },
  { key: 'vereine', label: 'Vereine & Verträge', icon: '🤝' },
  { key: 'buero', label: 'Büro & Verwaltung', icon: '🗂️' },
  { key: 'sonstiges', label: 'Sonstiges', icon: '✨' },
];

const PRIVATE_CATS = [
  { key: 'haushalt', label: 'Haushalt', icon: '🧹' },
  { key: 'finanzen', label: 'Finanzen', icon: '💶' },
  { key: 'gesundheit', label: 'Gesundheit & Sport', icon: '💪' },
  { key: 'familie', label: 'Familie & Freunde', icon: '❤️' },
  { key: 'termine', label: 'Termine', icon: '📅' },
  { key: 'einkauf', label: 'Einkaufen', icon: '🛒' },
  { key: 'sonstiges', label: 'Sonstiges', icon: '✨' },
];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function newPlayer(first, last) {
  return { id: slug(first + ' ' + last) || uid(), first, last, info: {}, todos: [] };
}
function defaultState() {
  return { players: PLAYERS.map(([f, l]) => newPlayer(f, l)), privat: { todos: [] }, beruf: { todos: [] }, termine: [] };
}
// Spieler, die nicht mehr betreut werden – werden auch aus gespeicherten Daten entfernt
const RETIRED = ['noah-wagner'];

function normalize(s) {
  s.players = (s.players || []).filter(p => p && p.id && !RETIRED.includes(p.id));
  s.players.forEach(p => {
    p.first = p.first || ''; p.last = p.last || '';
    p.info = p.info || {};
    AREAS.forEach(a => { p.info[a.key] = Object.assign(Object.fromEntries(a.fields.map(([k]) => [k, ''])), p.info[a.key] || {}); });
    p.todos = Array.isArray(p.todos) ? p.todos : [];
    p.fav = !!p.fav;
  });
  ['privat', 'beruf'].forEach(k => {
    s[k] = s[k] || {};
    s[k].todos = Array.isArray(s[k].todos) ? s[k].todos : [];
  });
  s.termine = (Array.isArray(s.termine) ? s.termine : []).filter(e => e && e.id && e.date);
  s.termine.forEach(e => { e.kind = e.kind === 'privat' ? 'privat' : 'beruf'; e.title = e.title || ''; });
  return s;
}

let state;
function loadLocal() {
  let s = null;
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  state = normalize(s || defaultState());
}
function storeLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function save() { storeLocal(); updateCounts(); scheduleSync(); }

/* =========================================================
   Synchronisation über das Claude-Konto (db-Capability)
   Alles liegt im privaten Bereich data/users/<id>/ – nur du siehst ihn:
   meta (Spieler-Reihenfolge), privat (private Todos), p_<spieler> je Spieler
   ========================================================= */
const sync = { coll: null, saved: {}, ready: false, writing: false, again: false, timer: null, pendingRender: false };

function setSync(kind, text) {
  const el = document.getElementById('sync');
  el.className = 'sync ' + kind;
  el.lastElementChild.textContent = text;
  el.title = text;
}
function docsFromState() {
  const d = { meta: { order: state.players.map(p => p.id) }, privat: { todos: state.privat.todos }, beruf: { todos: state.beruf.todos }, termine: { items: state.termine } };
  state.players.forEach(p => { d['p_' + p.id] = p; });
  return d;
}
function stateFromDocs(docs) {
  const order = (docs.meta && docs.meta.order) || [];
  const extra = Object.keys(docs).filter(k => k.startsWith('p_')).map(k => k.slice(2)).filter(id => !order.includes(id));
  const players = [...order, ...extra].map(id => docs['p_' + id]).filter(Boolean).map(p => structuredClone(p));
  return normalize({ players, privat: structuredClone(docs.privat || { todos: [] }), beruf: structuredClone(docs.beruf || { todos: [] }), termine: structuredClone((docs.termine && docs.termine.items) || []) });
}
function scheduleSync() {
  if (!sync.ready) return;
  setSync('busy', 'Speichert …');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(flush, 500);
}
async function flush() {
  if (!sync.ready) return;
  if (sync.writing) { sync.again = true; return; }
  sync.writing = true;
  try {
    do {
      sync.again = false;
      const local = docsFromState();
      const keys = new Set([...Object.keys(local), ...Object.keys(sync.saved)]);
      for (const k of keys) {
        const j = local[k] ? JSON.stringify(local[k]) : undefined;
        if (j === sync.saved[k]) continue;
        const ref = sync.coll.doc(k);
        if (j === undefined) { await ref.delete(); delete sync.saved[k]; }
        else { await ref.set(JSON.parse(j)); sync.saved[k] = j; }
      }
    } while (sync.again);
    setSync('ok', 'Synchronisiert');
  } catch (e) {
    console.error(e);
    setSync('err', e && e.code === 'quota_exceeded' ? 'Speicher voll – nicht gespeichert' : 'Nicht gespeichert – neuer Versuch …');
    setTimeout(scheduleSync, 4000);
  } finally { sync.writing = false; }
}
function applyRemote(snap) {
  const remote = {};
  snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });

  if (!sync.ready) {
    if (snap.metadata.fromCache) return;            // auf verbindliche Antwort warten
    sync.ready = true;
    clearTimeout(sync.loadTimer);
    if (!Object.keys(remote).length) {               // erster Start: Stand dieses Geräts hochladen
      sync.saved = {};
      setSync('busy', 'Speichert …');
      flush();
      return;
    }
    state = stateFromDocs(remote);
    sync.saved = {};
    Object.keys(remote).forEach(k => { sync.saved[k] = JSON.stringify(remote[k]); });
    storeLocal();
    setSync('ok', 'Synchronisiert');
    updateCounts(); safeRender();
    scheduleSync();                                  // schreibt nur, falls etwas fehlt
    return;
  }

  // Änderungen von anderen Geräten einarbeiten – eigene, noch nicht gespeicherte bleiben erhalten
  const local = docsFromState();
  const merged = {};
  let changed = false;
  for (const k of new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(sync.saved)])) {
    const lj = local[k] ? JSON.stringify(local[k]) : undefined;
    const rj = remote[k] ? JSON.stringify(remote[k]) : undefined;
    if (lj !== sync.saved[k]) { if (local[k]) merged[k] = local[k]; continue; }
    if (rj !== lj) changed = true;
    if (remote[k]) { merged[k] = remote[k]; sync.saved[k] = rj; } else delete sync.saved[k];
  }
  if (!changed) return;
  state = stateFromDocs(merged);
  storeLocal(); updateCounts(); safeRender();
}
async function startSync() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) {}
  if (!db || !user) { setSync('', 'Nur auf diesem Gerät'); return; }
  const id = await user.id().catch(() => null);
  if (!id) { setSync('', 'Nicht angemeldet – nur auf diesem Gerät'); return; }
  sync.coll = db.collection('data/users/' + id);
  setSync('busy', 'Verbinde …');
  sync.loadTimer = setTimeout(() => { if (!sync.ready) setSync('err', 'Keine Verbindung – zeigt Stand dieses Geräts'); }, 10000);
  sync.coll.onSnapshot(applyRemote, e => {
    console.error(e);
    clearTimeout(sync.loadTimer);
    sync.ready = false;
    setSync('err', 'Sync unterbrochen – Seite neu öffnen');
  });
}
// Nicht neu zeichnen, während gerade getippt wird
const typing = () => { const a = document.activeElement; return a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function safeRender() { if (typing()) { sync.pendingRender = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (sync.pendingRender && !typing()) render(); }, 0));

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function dueInfo(due) {
  if (!due) return null;
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - today()) / 86400000);
  let label;
  if (diff === 0) label = 'Heute';
  else if (diff === 1) label = 'Morgen';
  else if (diff === -1) label = 'Gestern';
  else label = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: Math.abs(diff) > 300 ? '2-digit' : undefined });
  return { diff, label, cls: diff < 0 ? 'over' : diff <= 3 ? 'soon' : '' };
}
const isOverdue = t => !t.done && t.due && dueInfo(t.due).diff < 0;
const isThisWeek = t => !t.done && t.due && (d => d >= 0 && d <= 7)(dueInfo(t.due).diff);
function sortTodos(list) {
  return [...list].sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    if (!!a.prio !== !!b.prio) return a.prio ? -1 : 1;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1; if (b.due) return 1;
    return (b.created || 0) - (a.created || 0);
  });
}
const COLORS = ['#2457d6', '#7c3aed', '#c0266d', '#d4570b', '#0b7f9a', '#1f8a4c', '#a87400', '#4f46e5', '#0d8577', '#b4233c'];
function colorFor(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const initials = p => ((p.first[0] || '') + (p.last[0] || '')).toUpperCase();
const avatar = p => `<div class="avatar" style="background:${colorFor(p.id)}">${esc(initials(p))}</div>`;
const fullName = p => `${p.first} ${p.last}`.trim();
function areaStatus(p, a) {
  const keys = a.fields.filter(f => f[2] !== 'area').map(f => f[0]);
  const filled = keys.filter(k => (p.info[a.key][k] || '').trim()).length;
  return { filled, total: keys.length, cls: filled === 0 ? '' : filled === keys.length ? 'full' : 'part' };
}
const openCount = list => list.filter(t => !t.done).length;
const findPlayer = id => state.players.find(p => p.id === id);
const allPlayerTodos = () => state.players.flatMap(p => p.todos.map(t => ({ ...t, player: p })));
const allBerufTodos = () => [...allPlayerTodos(), ...state.beruf.todos];

/* ---------- Dialoge (statt prompt/confirm) ---------- */
function dialog({ title, text = '', fields = [], ok = 'OK', danger = false, cancel = true, extra = null }) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    const control = (f, id) => {
      const req = f.required ? 'required' : '';
      if (f.type === 'select') return `<select class="input" id="${id}" name="${f.name}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === (f.value || '') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
      if (f.type === 'textarea') return `<textarea class="input" id="${id}" name="${f.name}" rows="2">${esc(f.value || '')}</textarea>`;
      return `<input class="input" type="${f.type || 'text'}" id="${id}" name="${f.name}" value="${esc(f.value || '')}" ${req} autocomplete="off">`;
    };
    back.innerHTML = `<form class="modal" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
      ${fields.length ? `<div class="dlg-fields">${fields.map((f, i) => `<div class="field ${f.half ? 'half' : ''}" data-fname="${f.name}"><label for="dlg-${i}">${esc(f.label)}</label>${control(f, 'dlg-' + i)}</div>`).join('')}</div>` : ''}
      <div class="actions">${extra ? `<button type="button" class="btn danger" data-extra style="margin-right:auto">${esc(extra.label)}</button>` : ''}${cancel ? '<button type="button" class="btn ghost" data-cancel>Abbrechen</button>' : ''}<button type="submit" class="btn ${danger ? 'danger-fill' : 'primary'}">${esc(ok)}</button></div>
    </form>`;
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', e => { if (e.target === back) close(null); });
    const c = back.querySelector('[data-cancel]'); if (c) c.onclick = () => close(null);
    const x = back.querySelector('[data-extra]'); if (x) x.onclick = () => close(extra.value);
    const form = back.querySelector('form');
    const applyShowIf = () => fields.filter(f => f.showIf).forEach(f => {
      const [dep, val] = f.showIf; back.querySelector(`[data-fname="${f.name}"]`).hidden = form.elements[dep].value !== val;
    });
    form.addEventListener('change', applyShowIf); applyShowIf();
    form.onsubmit = e => { e.preventDefault(); close(fields.length ? Object.fromEntries(new FormData(form)) : true); };
    document.body.appendChild(back);
    (back.querySelector('input, select, textarea') || back.querySelector('[type=submit]')).focus();
  });
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* =========================================================

const ui = { filter: 'offen', cat: 'alle', search: '', sortMode: false };

        <div class="todo-sub">

function addFormHTML(cats, defaultCat) {

}
function filterHTML(cats, list) {
  const n = { offen: openCount(list), erledigt: list.length - openCount(list), alle: list.length };
  const names = { offen: 'Offen', erledigt: 'Erledigt', alle: 'Alle' };
  return `<div class="filters">
    ${['offen', 'erledigt', 'alle'].map(f => `<button class="chip ${ui.filter === f ? 'active' : ''}" data-filter="${f}">${names[f]} (${n[f]})</button>`).join('')}
    <span style="width:8px"></span>

}
const applyFilter = list => list.filter(t => (ui.filter === 'alle' || (ui.filter === 'offen' ? !t.done : t.done)) && (ui.cat === 'alle' || t.cat === ui.cat));
const todoArray = owner => owner === '__privat' ? state.privat.todos : owner === '__beruf' ? state.beruf.todos : (findPlayer(owner) || { todos: [] }).todos;

const app = document.getElementById('app');
const openCards = {};

function tileHTML(p) {

  const controls = ui.sortMode

    : `<button class="star ${p.fav ? 'on' : ''}" data-fav="${esc(p.id)}" title="${p.fav ? 'Aus Favoriten entfernen' : 'Als Favorit markieren'}" aria-pressed="${p.fav}">${p.fav ? '★' : '☆'}</button>`;
  return `<div class="tile ${p.fav ? 'is-fav' : ''} ${ui.sortMode ? 'sorting' : ''}" data-id="${esc(p.id)}" data-href="#s-${esc(p.id)}" tabindex="0" role="link" aria-label="${esc(fullName(p))} öffnen" ${ui.sortMode ? 'draggable="true"' : ''}>

      return `<div class="area-dot ${s.cls} ${hasTodo ? 'has-todo' : ''}" title="${a.label}: ${s.filled}/${s.total} Felder${hasTodo ? ' · offene Aufgaben' : ''}"><i></i>${a.short}</div>`;

function toggleFav(id) {
  const p = findPlayer(id); if (!p) return;
  p.fav = !p.fav; save(); render();
  toast(p.fav ? `${fullName(p)} ist jetzt Favorit` : `${fullName(p)} aus Favoriten entfernt`);
}
// Spieler innerhalb seiner Gruppe (Favoriten / weitere) verschieben
function movePlayer(id, dir) {
  const p = findPlayer(id); if (!p) return;
  const group = state.players.filter(x => x.fav === p.fav);
  const j = group.indexOf(p) + dir;
  if (j < 0 || j >= group.length) return;
  const a = state.players.indexOf(p), b = state.players.indexOf(group[j]);
  [state.players[a], state.players[b]] = [state.players[b], state.players[a]];
  save(); renderBeruflich();
  const btn = app.querySelector(`[data-id="${CSS.escape(id)}"][data-move="${dir}"]`); if (btn) btn.focus();
}
function dropPlayer(dragId, targetId) {
  const p = findPlayer(dragId), t = findPlayer(targetId);
  if (!p || !t || p === t || p.fav !== t.fav) return;
  const from = state.players.indexOf(p);
  state.players.splice(from, 1);
  const to = state.players.indexOf(t);
  state.players.splice(from <= to ? to + 1 : to, 0, p);
  save(); renderBeruflich();
}
function getShowOthers() { try { return localStorage.getItem('todoapp.showOthers') === '1'; } catch (e) { return false; } }
function setShowOthers(v) { try { localStorage.setItem('todoapp.showOthers', v ? '1' : '0'); } catch (e) {} }

  document.getElementById('search').addEventListener('input', e => {

/* =========================================================
   Events für Todo-Listen
   ========================================================= */
function bindTodoEvents(owner) {
  const form = document.getElementById('addForm');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(form);
    const text = (fd.get('text') || '').trim(); if (!text) return;
    todoArray(owner).push({ id: uid(), text, cat: fd.get('cat'), due: fd.get('due') || '', prio: !!fd.get('prio'), done: false, created: Date.now() });
    if (ui.filter === 'erledigt') ui.filter = 'offen';
    save(); render();
    document.getElementById('new-text').focus();
  });

  app.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { ui.filter = b.dataset.filter; render(); });
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { ui.cat = b.dataset.cat; render(); });

  app.querySelectorAll('.todo').forEach(li => {
    const arr = todoArray(owner);
    const t = arr.find(t => t.id === li.dataset.id);
    if (!t) return;
    li.querySelector('input[type=checkbox]').onchange = e => { t.done = e.target.checked; t.doneAt = t.done ? Date.now() : null; save(); render(); };
    li.querySelector('[data-del]').onclick = () => { arr.splice(arr.indexOf(t), 1); save(); render(); };
    const txt = li.querySelector('.todo-text');
    txt.ondblclick = () => {
      txt.innerHTML = `<input class="edit-input" id="edit-${esc(t.id)}" value="${esc(t.text)}">`;
      const inp = txt.querySelector('input'); inp.focus(); inp.select();
      const commit = () => { const v = inp.value.trim(); if (v && v !== t.text) { t.text = v; save(); } render(); };
      inp.onblur = commit;
      inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.onblur = null; render(); } };
    };
  });
}

/* =========================================================
   Termine & Kalender
   ========================================================= */
const KIND = { beruf: { label: 'Beruflich', icon: '💼' }, privat: { label: 'Privat', icon: '🏠' } };
const WEEKDAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = s => new Date(s + 'T00:00:00');
const evSort = (a, b) => (a.date + (a.time || '00:00')).localeCompare(b.date + (b.time || '00:00'));
const evTime = e => e.time ? (e.time + (e.end ? '–' + e.end : '')) : 'ganztägig';
function fmtDay(s, long) {
  return parseYmd(s).toLocaleDateString('de-DE', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: '2-digit', month: '2-digit' });
}
const cal = {
  month: (() => { const d = today(); d.setDate(1); return d; })(),
  sel: ymd(today()),
  show: (() => { try { return Object.assign({ beruf: true, privat: true, todos: false }, JSON.parse(localStorage.getItem('todoapp.cal') || '{}')); } catch (e) { return { beruf: true, privat: true, todos: false }; } })(),
};
const saveCalPrefs = () => { try { localStorage.setItem('todoapp.cal', JSON.stringify(cal.show)); } catch (e) {} };

function upcomingEvents({ kind, playerId, limit = 5 } = {}) {
  const t = ymd(today());
  return state.termine.filter(e => e.date >= t && (!kind || e.kind === kind) && (!playerId || e.playerId === playerId)).sort(evSort).slice(0, limit);
}
function eventRowHTML(e, opts = {}) {
  const p = e.playerId && findPlayer(e.playerId);
  return `<button class="ev-row ${e.kind}" data-ev="${esc(e.id)}">
    ${opts.hideDate ? '' : `<span class="ev-date"><b>${parseYmd(e.date).getDate()}</b>${parseYmd(e.date).toLocaleDateString('de-DE', { month: 'short' })}</span>`}
    <span class="ev-main"><span class="ev-title">${esc(e.title)}</span>
      <small>${opts.hideDate ? '' : fmtDay(e.date) + ' · '}${evTime(e)}${p && !opts.hidePlayer ? ' · ' + esc(fullName(p)) : ''}${e.ort ? ' · ' + esc(e.ort) : ''}</small></span>
    <span class="ev-kind">${KIND[e.kind].icon}</span>
  </button>`;
}
function eventsPanelHTML(title, list, addArgs, emptyText) {
  return `<div class="ev-panel">
    <div class="ev-head"><h2>${title}</h2><button class="btn small" data-add-ev='${esc(JSON.stringify(addArgs))}'>+ Termin</button></div>
    ${list.length ? `<div class="ev-list">${list.map(e => eventRowHTML(e, { hidePlayer: !!addArgs.playerId })).join('')}</div>` : `<div class="empty small">${emptyText}</div>`}
    <a class="ev-more" href="#kalender">Zum Kalender →</a>
  </div>`;
}
async function editEvent(ev, preset = {}) {
  const isNew = !ev;
  const e = ev || { id: uid(), title: '', date: preset.date || cal.sel || ymd(today()), time: '', end: '', kind: preset.kind || 'beruf', playerId: preset.playerId || '', ort: '', notiz: '' };
  const r = await dialog({
    title: isNew ? 'Neuer Termin' : 'Termin bearbeiten', ok: 'Speichern',
    extra: isNew ? null : { label: 'Löschen', value: '__delete' },
    fields: [
      { name: 'title', label: 'Titel', value: e.title, required: true },
      { name: 'kind', label: 'Bereich', type: 'select', value: e.kind, options: [['beruf', '💼 Beruflich'], ['privat', '🏠 Privat']], half: true },
      { name: 'date', label: 'Datum', type: 'date', value: e.date, required: true, half: true },
      { name: 'time', label: 'Von (optional)', type: 'time', value: e.time, half: true },
      { name: 'end', label: 'Bis (optional)', type: 'time', value: e.end, half: true },
      { name: 'playerId', label: 'Spieler (optional)', type: 'select', value: e.playerId, showIf: ['kind', 'beruf'],
        options: [['', '– keiner –'], ...state.players.map(p => [p.id, fullName(p)])] },
      { name: 'ort', label: 'Ort (optional)', value: e.ort },
      { name: 'notiz', label: 'Notiz (optional)', type: 'textarea', value: e.notiz },
    ],
  });
  if (!r) return;
  if (r === '__delete') {
    state.termine = state.termine.filter(x => x.id !== e.id); save(); render(); toast('Termin gelöscht'); return;
  }
  Object.assign(e, { title: r.title.trim(), kind: r.kind, date: r.date, time: r.time || '', end: r.end || '', playerId: r.kind === 'beruf' ? (r.playerId || '') : '', ort: r.ort.trim(), notiz: r.notiz.trim() });
  if (isNew) state.termine.push(e);
  save(); render(); toast(isNew ? 'Termin angelegt' : 'Termin gespeichert');
}
function bindEventClicks() {
  app.querySelectorAll('[data-ev]').forEach(b => b.onclick = ev => { ev.stopPropagation(); editEvent(state.termine.find(x => x.id === b.dataset.ev)); });
  app.querySelectorAll('[data-add-ev]').forEach(b => b.onclick = () => editEvent(null, JSON.parse(b.dataset.addEv)));
}

function renderKalender() {
  const y = cal.month.getFullYear(), m = cal.month.getMonth();
  const first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const weeks = Math.ceil((offset + daysInMonth) / 7);
  const start = new Date(y, m, 1 - offset);
  const t = ymd(today());

  const evs = state.termine.filter(e => cal.show[e.kind]);
  const dueTodos = cal.show.todos ? [
    ...(cal.show.beruf ? allPlayerTodos().map(x => ({ ...x, kind: 'beruf' })) : []),
    ...(cal.show.beruf ? state.beruf.todos.map(x => ({ ...x, kind: 'beruf' })) : []),
    ...(cal.show.privat ? state.privat.todos.map(x => ({ ...x, kind: 'privat' })) : []),
  ].filter(x => x.due && !x.done) : [];
  const byDay = {};
  evs.forEach(e => (byDay[e.date] = byDay[e.date] || { ev: [], td: [] }).ev.push(e));
  dueTodos.forEach(x => (byDay[x.due] = byDay[x.due] || { ev: [], td: [] }).td.push(x));
  Object.values(byDay).forEach(d => d.ev.sort(evSort));

  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = ymd(d), items = byDay[k] || { ev: [], td: [] };
    const all = [...items.ev.map(e => `<span class="ev ${e.kind}" title="${esc(evTime(e) + ' ' + e.title)}">${e.time ? `<em>${e.time}</em> ` : ''}${esc(e.title)}</span>`),
                 ...items.td.map(x => `<span class="ev todo-ev ${x.kind}" title="Aufgabe: ${esc(x.text)}">☐ ${esc(x.text)}</span>`)];
    cells += `<button class="day ${d.getMonth() !== m ? 'out' : ''} ${k === t ? 'is-today' : ''} ${k === cal.sel ? 'is-sel' : ''} ${(d.getDay() + 6) % 7 > 4 ? 'we' : ''}" data-day="${k}" aria-label="${fmtDay(k, true)}, ${all.length} Einträge">
      <span class="dn">${d.getDate()}</span>
      <span class="evs">${all.slice(0, 3).join('')}${all.length > 3 ? `<span class="more">+${all.length - 3}</span>` : ''}</span>
    </button>`;
  }
  const selItems = byDay[cal.sel] || { ev: [], td: [] };
  const monthName = first.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

  app.innerHTML = `
    <h1>Kalender</h1>
    <p class="sub">Berufliche und private Termine – einzeln oder übereinander anzeigen.</p>
    <div class="cal-bar">
      <div class="cal-nav">
        <button class="btn" id="calPrev" aria-label="Vorheriger Monat">‹</button>
        <h2 class="cal-month">${monthName}</h2>
        <button class="btn" id="calNext" aria-label="Nächster Monat">›</button>
        <button class="btn ghost" id="calToday">Heute</button>
      </div>
      <div class="cal-toggles">
        <button class="chip kind-chip beruf ${cal.show.beruf ? 'on' : ''}" data-show="beruf" aria-pressed="${cal.show.beruf}">💼 Beruflich</button>
        <button class="chip kind-chip privat ${cal.show.privat ? 'on' : ''}" data-show="privat" aria-pressed="${cal.show.privat}">🏠 Privat</button>
        <button class="chip ${cal.show.todos ? 'active' : ''}" data-show="todos" aria-pressed="${cal.show.todos}">☐ Fällige Aufgaben</button>
        <button class="btn primary" data-add-ev='${esc(JSON.stringify({ date: cal.sel }))}'>+ Termin</button>
      </div>
    </div>
    <div class="cal-layout">
      <div class="panel cal-panel">
        <div class="cal-grid head">${WEEKDAYS.map(w => `<span>${w}</span>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
      </div>
      <aside class="panel">
        <div class="ev-head"><h2>${fmtDay(cal.sel, true)}</h2><button class="btn small" data-add-ev='${esc(JSON.stringify({ date: cal.sel }))}'>+ Termin</button></div>
        ${selItems.ev.length ? `<div class="ev-list">${selItems.ev.map(e => eventRowHTML(e, { hideDate: true })).join('')}</div>` : '<div class="empty small">Keine Termine an diesem Tag.</div>'}
        ${selItems.td.length ? `<h3 class="mini">Fällige Aufgaben</h3><ul class="plain">${selItems.td.map(x => `<li><span class="dot ${x.kind}"></span>${esc(x.text)}${x.player ? ` <a href="#s-${esc(x.player.id)}">${esc(fullName(x.player))}</a>` : ''}</li>`).join('')}</ul>` : ''}
        <h3 class="mini">Nächste Termine</h3>
        ${(() => { const up = state.termine.filter(e => cal.show[e.kind] && e.date >= t).sort(evSort).slice(0, 6);
          return up.length ? `<div class="ev-list">${up.map(e => eventRowHTML(e)).join('')}</div>` : '<div class="empty small">Keine anstehenden Termine.</div>'; })()}
      </aside>
    </div>`;

  const shift = n => { cal.month = new Date(y, m + n, 1); renderKalender(); };
  document.getElementById('calPrev').onclick = () => shift(-1);
  document.getElementById('calNext').onclick = () => shift(1);
  document.getElementById('calToday').onclick = () => { cal.month = new Date(today().getFullYear(), today().getMonth(), 1); cal.sel = t; renderKalender(); };
  app.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { cal.show[b.dataset.show] = !cal.show[b.dataset.show]; saveCalPrefs(); renderKalender(); });
  app.querySelectorAll('[data-day]').forEach(b => {
    b.onclick = () => {
      const d = b.dataset.day; cal.sel = d;
      const dd = parseYmd(d); if (dd.getMonth() !== m) cal.month = new Date(dd.getFullYear(), dd.getMonth(), 1);
      renderKalender();
      if (window.innerWidth < 960) app.querySelector('.cal-layout aside').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    b.ondblclick = () => editEvent(null, { date: b.dataset.day });
  });
  bindEventClicks();
}

/* =========================================================
   Startseite: alle offenen Aufgaben, Ampel-System
   Rot  = überfällig, heute fällig oder als „Wichtig“ markiert
   Gelb = fällig in den nächsten 7 Tagen
   Grün = später fällig oder ohne Datum
   ========================================================= */
const AMPEL = [
  { key: 'rot', label: 'Dringend', hint: 'überfällig, heute fällig oder wichtig' },
  { key: 'gelb', label: 'Bald', hint: 'fällig in den nächsten 7 Tagen' },
  { key: 'gruen', label: 'Mit Zeit', hint: 'später fällig oder ohne Datum' },
];
function ampel(t) {
  if (t.done) return '';
  const d = dueInfo(t.due);
  if (t.prio || (d && d.diff <= 0)) return 'rot';
  if (d && d.diff <= 7) return 'gelb';
  return 'gruen';
}
const ampelLabel = k => (AMPEL.find(a => a.key === k) || {}).label || '';
function startItems() {
  return [
    ...state.players.flatMap(p => p.todos.map(t => ({ t, kind: 'beruf', owner: p.id, player: p, cat: PLAYER_CATS.find(c => c.key === t.cat) }))),
    ...state.beruf.todos.map(t => ({ t, kind: 'beruf', owner: '__beruf', cat: BERUF_CATS.find(c => c.key === t.cat) })),
    ...state.privat.todos.map(t => ({ t, kind: 'privat', owner: '__privat', cat: PRIVATE_CATS.find(c => c.key === t.cat) })),
  ];
}
const startPrefs = (() => { try { return Object.assign({ kind: 'alle' }, JSON.parse(localStorage.getItem('todoapp.start') || '{}')); } catch (e) { return { kind: 'alle' }; } })();

function renderStart() {
  const all = startItems();
  const open = all.filter(x => !x.t.done);
  const shown = open.filter(x => startPrefs.kind === 'alle' || x.kind === startPrefs.kind);
  const groups = { rot: [], gelb: [], gruen: [] };
  shown.forEach(x => groups[ampel(x.t)].push(x));
  Object.keys(groups).forEach(k => { const s = sortTodos(groups[k].map(x => x.t)); groups[k].sort((a, b) => s.indexOf(a.t) - s.indexOf(b.t)); });
  const t0 = ymd(today());
  const t1 = (() => { const d = today(); d.setDate(d.getDate() + 1); return ymd(d); })();
  const todayEv = state.termine.filter(e => e.date === t0 || e.date === t1).sort(evSort);
  const doneToday = all.filter(x => x.t.done && x.t.doneAt && x.t.doneAt >= today().getTime()).length;
  const count = (k, kind) => open.filter(x => ampel(x.t) === k && (!kind || x.kind === kind)).length;
  const hour = new Date().getHours();
  const greet = hour < 11 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';

  const itemHTML = x => {
    const d = dueInfo(x.t.due);
    const where = x.kind === 'privat'
      ? `<span class="tag kind privat">🏠 Privat${x.cat ? ' · ' + esc(x.cat.label) : ''}</span>`
      : x.player
        ? `<a class="tag kind beruf" href="#s-${esc(x.player.id)}">💼 ${esc(fullName(x.player))}${x.cat ? ' · ' + esc(x.cat.label) : ''}</a>`
        : `<span class="tag kind beruf">💼 Sonstiges${x.cat ? ' · ' + esc(x.cat.label) : ''}</span>`;
    return `<li class="st-item ${x.kind}" data-owner="${esc(x.owner)}" data-id="${esc(x.t.id)}">
      <input type="checkbox" aria-label="Erledigt">
      <div class="st-body">
        <div class="st-text">${x.t.prio ? '<b class="imp">!</b> ' : ''}${esc(x.t.text)}</div>
        <div class="todo-sub">${where}${d ? `<span class="tag due ${d.cls}">📅 ${d.label}</span>` : ''}</div>
      </div>
    </li>`;
  };

  app.innerHTML = `
    <h1>${greet}</h1>
    <p class="sub">${fmtDay(t0, true)} · ${open.length} offene Aufgaben${doneToday ? ` · heute ${doneToday} erledigt` : ''}</p>

    <div class="ampel-sum">
      ${AMPEL.map(a => `<div class="amp-card ${a.key}">
        <span class="amp-light ${a.key}"></span>
        <div><div class="v">${count(a.key)}</div><div class="l">${a.label}</div></div>
        <div class="split"><span class="beruf">💼 ${count(a.key, 'beruf')}</span><span class="privat">🏠 ${count(a.key, 'privat')}</span></div>
      </div>`).join('')}
    </div>

    <div class="st-tools">
      <div class="filters" style="margin:0">
        ${[['alle', 'Alle'], ['beruf', '💼 Beruflich'], ['privat', '🏠 Privat']].map(([k, l]) => `<button class="chip ${startPrefs.kind === k ? 'active' : ''}" data-kind="${k}">${l}</button>`).join('')}
      </div>
      <form class="quick-add" id="quickAdd">
        <input class="input" id="qa-text" name="text" placeholder="Schnell eine Aufgabe notieren …" autocomplete="off" required>
        <select class="input" id="qa-owner" name="owner" aria-label="Wohin">
          <option value="__privat">🏠 Privat</option>
          <option value="__beruf">💼 Beruflich (sonstige)</option>
          <optgroup label="Spieler">${state.players.map(p => `<option value="${esc(p.id)}">${p.fav ? '★ ' : ''}${esc(fullName(p))}</option>`).join('')}</optgroup>
        </select>
        <input class="input" type="date" id="qa-due" name="due" title="Fällig am">
        <label class="prio-toggle"><input type="checkbox" id="qa-prio" name="prio"> Wichtig</label>
        <button class="btn primary" type="submit">+</button>
      </form>
    </div>

    <div class="st-layout">
      <div class="ampel-cols">
        ${AMPEL.map(a => `<section class="amp-col ${a.key}">
          <h2><span class="amp-light ${a.key}"></span>${a.label} <span class="n">${groups[a.key].length}</span></h2>
          <p class="amp-hint">${a.hint}</p>
          ${groups[a.key].length ? `<ul class="st-list">${groups[a.key].map(itemHTML).join('')}</ul>` : `<div class="empty small">${a.key === 'rot' ? 'Nichts Dringendes.' : 'Keine Aufgaben.'}</div>`}
        </section>`).join('')}
      </div>
      <aside class="panel">
        <div class="ev-head"><h2>Heute & morgen</h2><button class="btn small" data-add-ev='${esc(JSON.stringify({ date: t0 }))}'>+ Termin</button></div>
        ${todayEv.length ? `<div class="ev-list" style="margin-top:10px">${todayEv.map(e => eventRowHTML(e)).join('')}</div>` : '<div class="empty small">Keine Termine heute und morgen.</div>'}
        <a class="ev-more" href="#kalender" style="display:inline-block;margin-top:10px">Zum Kalender →</a>
        <h3 class="mini">Legende</h3>
        <ul class="plain legend">
          <li><span class="sw beruf"></span>Beruflich</li>
          <li><span class="sw privat"></span>Privat</li>
          <li><span class="amp-light rot"></span>Rot: überfällig, heute fällig oder „Wichtig“</li>
          <li><span class="amp-light gelb"></span>Gelb: fällig in den nächsten 7 Tagen</li>
          <li><span class="amp-light gruen"></span>Grün: später oder ohne Datum</li>
        </ul>
      </aside>
    </div>`;

  app.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
    startPrefs.kind = b.dataset.kind;
    try { localStorage.setItem('todoapp.start', JSON.stringify(startPrefs)); } catch (e) {}
    renderStart();
  });
  app.querySelectorAll('.st-item').forEach(li => {
    const t = todoArray(li.dataset.owner).find(x => x.id === li.dataset.id);
    li.querySelector('input').onchange = () => {
      t.done = true; t.doneAt = Date.now(); li.classList.add('leaving'); save();
      setTimeout(renderStart, 250); toast('Erledigt ✓');
    };
  });
  const qa = document.getElementById('quickAdd');
  try { const last = localStorage.getItem('todoapp.qaOwner'); if (last && qa.owner.querySelector(`option[value="${CSS.escape(last)}"]`)) qa.owner.value = last; } catch (e) {}
  qa.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(qa); const text = fd.get('text').trim(); if (!text) return;
    const owner = fd.get('owner');
    const cat = owner === '__privat' ? 'sonstiges' : owner === '__beruf' ? 'allgemein' : 'allgemein';
    todoArray(owner).push({ id: uid(), text, cat, due: fd.get('due') || '', prio: !!fd.get('prio'), done: false, created: Date.now() });
    try { localStorage.setItem('todoapp.qaOwner', owner); } catch (e) {}
    save(); renderStart(); document.getElementById('qa-text').focus(); toast('Aufgabe angelegt');
  };
  bindEventClicks();
}

/* =========================================================
   Router (#start, #beruflich, #privat, #kalender, #s-<spieler>)
   ========================================================= */
let lastRoute = null;
function render() {
  sync.pendingRender = false;
  const h = location.hash || '#start';
  const route = h.startsWith('#s-') ? 'spieler' : h === '#privat' ? 'privat' : h === '#kalender' ? 'kalender' : h === '#beruflich' ? 'beruflich' : 'start';
  const changed = h !== lastRoute;
  if (changed) { ui.filter = 'offen'; ui.cat = 'alle'; ui.sortMode = false; ui.keepOthersOpen = false; Object.keys(openCards).forEach(k => delete openCards[k]); }
  lastRoute = h;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.route === (route === 'spieler' ? 'beruflich' : route)));

  if (route === 'spieler') renderPlayer(decodeURIComponent(h.slice(3)));
  else if (route === 'privat') renderPrivat();
  else if (route === 'kalender') renderKalender();
  else if (route === 'start') renderStart();
  else renderBeruflich();
  if (changed) window.scrollTo(0, 0);
}
function updateCounts() {
  document.getElementById('cnt-beruf').textContent = openCount(allBerufTodos());
  document.getElementById('cnt-privat').textContent = openCount(state.privat.todos);
  document.getElementById('cnt-start').textContent = [...allBerufTodos(), ...state.privat.todos].filter(t => !t.done && (t.prio || (t.due && dueInfo(t.due).diff <= 0))).length;
  document.getElementById('cnt-start').title = 'Dringende Aufgaben';
  const t0 = ymd(today()); document.getElementById('cnt-kal').textContent = state.termine.filter(e => e.date === t0).length;
  document.getElementById('cnt-kal').title = 'Termine heute';
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
window.addEventListener('hashchange', render);

document.getElementById('menuBtn').onclick = e => {
  e.stopPropagation();
  document.getElementById('menuNote').textContent = sync.ready
    ? 'Deine Daten liegen privat in deinem Claude-Konto und sind auf Handy und Laptop gleich.'
    : 'Daten liegen nur in diesem Browser. Mit einem Backup lassen sie sich auf ein anderes Gerät übertragen.';
  menu.hidden = !menu.hidden;
};
document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.hidden = true; });
document.getElementById('exportBtn').onclick = async () => {
  menu.hidden = true;
  const filename = `todo-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const data = JSON.stringify(state, null, 2);
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data }); } catch (e) { if (e && e.code !== 'dismissed') toast('Backup konnte nicht gespeichert werden'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById('importBtn').onclick = () => { menu.hidden = true; document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (!Array.isArray(data.players)) throw new Error(); }
  catch { await dialog({ title: 'Datei nicht lesbar', text: 'Das ist kein gültiges Backup dieser App.', ok: 'OK', cancel: false }); return; }
  const ok = await dialog({ title: 'Backup einspielen?', text: `Die aktuellen Daten werden durch das Backup ersetzt (${data.players.length} Spieler).`, ok: 'Ersetzen', danger: true });
  if (!ok) return;
  state = normalize(data); save(); render(); toast('Backup eingespielt');
};

loadLocal(); updateCounts(); render(); startSync();
</script>
</body>
</html>
