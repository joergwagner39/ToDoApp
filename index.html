<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Spieler & Privat ToDo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  /* Layout: sticky Kopfzeile mit Umschalter Beruflich/Privat, darunter Kennzahlen, Kachelraster + Seitenleiste */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-2: #f6f8fb;
    --border: #e0e5ec;
    --text: #18202b;
    --muted: #667085;
    --accent: #2457d6;
    --accent-soft: #e7eefe;
    --on-accent: #ffffff;
    --privat: #0c8a68;
    --privat-soft: #e1f4ec;
    --danger: #c92a2a;
    --danger-soft: #fdeaea;
    --warn: #b86a00;
    --warn-soft: #fdf2df;
    --ok: #1f9d55;
    --overlay: rgba(16, 24, 40, .45);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --radius: 12px;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141a; --surface: #181d25; --surface-2: #1f252e; --border: #2b333e;
      --text: #e6eaf0; --muted: #98a2b3; --accent: #7aa2ff; --accent-soft: #1c2945; --on-accent: #0d1424;
      --privat: #44cf9e; --privat-soft: #143128; --danger: #f87171; --danger-soft: #3a1e1e;
      --warn: #fbbf24; --warn-soft: #3a2d14; --ok: #4ade80; --overlay: rgba(0,0,0,.6);
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141a; --surface: #181d25; --surface-2: #1f252e; --border: #2b333e;
    --text: #e6eaf0; --muted: #98a2b3; --accent: #7aa2ff; --accent-soft: #1c2945; --on-accent: #0d1424;
    --privat: #44cf9e; --privat-soft: #143128; --danger: #f87171; --danger-soft: #3a1e1e;
    --warn: #fbbf24; --warn-soft: #3a2d14; --ok: #4ade80; --overlay: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- Header ---------- */
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top-inner { padding-block: 10px; display: flex; align-items: center; gap: 12px; position: relative; }
  .brand { font-family: var(--font-head); font-weight: 700; font-size: 18px; margin-right: auto; display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .sync { font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .sync.ok i { background: var(--ok); }
  .sync.busy i { background: var(--warn); }
  .sync.err i { background: var(--danger); }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tab .count { font-size: 12px; background: var(--border); color: var(--text); border-radius: 999px; padding: 0 7px; font-variant-numeric: tabular-nums; }
  .tab.active.beruf { background: var(--accent); color: var(--on-accent); }
  .tab.active.privat { background: var(--privat); color: var(--on-accent); }
  .tab.active .count { background: rgba(255,255,255,.25); color: inherit; }
  .menu-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .menu { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; z-index: 20; width: 260px; max-width: calc(100vw - 32px); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--surface-2); }
  .menu .note { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; border-top: 1px solid var(--border); margin-top: 4px; }

  main.wrap { padding-block: 20px 60px; }
  h1 { font-family: var(--font-head); font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; text-wrap: balance; }
  h2 { font-family: var(--font-head); font-size: 17px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .v { font-family: var(--font-head); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.danger .v { color: var(--danger); }
  .stat.warn .v { color: var(--warn); }

  /* ---------- Controls ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; min-width: 180px; width: auto; }
  .input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); outline: none; min-width: 0; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 9px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .privat-page .btn.primary { background: var(--privat); border-color: var(--privat); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.danger { color: var(--danger); }
  .btn.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }

  /* ---------- Player tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; box-shadow: var(--shadow); text-decoration: none; display: flex; flex-direction: column; gap: 12px; transition: transform .12s ease, border-color .12s ease; }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
  .tile-head { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; }
  .tile-name { font-weight: 700; line-height: 1.2; min-width: 0; }
  .tile-name small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
  .tile-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill.open { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.over { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .areas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .area-dot { text-align: center; font-size: 10px; color: var(--muted); }
  .area-dot i { display: block; height: 5px; border-radius: 3px; background: var(--border); margin-bottom: 3px; }
  .area-dot.full i { background: var(--ok); }
  .area-dot.part i { background: var(--warn); }
  .area-dot.has-todo { color: var(--accent); font-weight: 700; }

  /* ---------- Todo list ---------- */
  .add-form { display: grid; grid-template-columns: minmax(0, 1fr) 170px 150px auto auto; gap: 8px; margin-bottom: 14px; }
  .prio-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 600; user-select: none; background: var(--surface); }
  .prio-toggle input { accent-color: var(--danger); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: var(--surface); padding: 4px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .todos { list-style: none; margin: 0; padding: 0; }
  .todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 4px; border-bottom: 1px solid var(--border); }
  .todo:last-child { border-bottom: 0; }
  .todo input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
  .privat-page .todo input[type=checkbox] { accent-color: var(--privat); }
  .todo-text { overflow-wrap: anywhere; cursor: text; }
  .todo.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-sub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .tag.due.over { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .tag.due.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.prio { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 16px; opacity: .55; }
  .todo:hover .icon-btn, .icon-btn:focus { opacity: 1; }
  .icon-btn:hover { background: var(--surface-2); color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 14px; }
  .edit-input { width: 100%; padding: 4px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); }

  /* ---------- Player detail ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
  .back:hover { color: var(--text); }
  .player-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .player-head .avatar { width: 60px; height: 60px; font-size: 21px; }
  .player-head .grow { flex: 1; min-width: 200px; }
  .progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 8px; max-width: 320px; }
  .progress b { display: block; height: 100%; background: var(--ok); }
  .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; align-items: start; }
  .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .info-card summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .info-card summary::-webkit-details-marker { display: none; }
  .info-card .ic { font-size: 20px; }
  .info-card .t { font-weight: 700; flex: 1; min-width: 0; }
  .info-card .t small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .info-card .chev { color: var(--muted); transition: transform .15s; }
  .info-card[open] .chev { transform: rotate(90deg); }
  .info-body { padding: 12px 14px 14px; display: grid; gap: 8px; border-top: 1px solid var(--border); }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .field .input { padding: 7px 10px; }
  textarea.input { resize: vertical; min-height: 60px; }
  .status { width: 10px; height: 10px; border-radius: 50%; background: var(--border); flex: none; }
  .status.full { background: var(--ok); }
  .status.part { background: var(--warn); }
  .info-open-todos { color: var(--accent); font-weight: 600; }

  /* ---------- Upcoming ---------- */
  .up-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); text-decoration: none; }
  .up-item .avatar { width: 30px; height: 30px; font-size: 11px; }
  .up-item .x { flex: 1; min-width: 0; }
  .up-item .x div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up-item .x small { color: var(--muted); }

  /* ---------- Private groups ---------- */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .group h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .group h3 .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }

  /* ---------- Modal ---------- */
  .modal-back { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0; font-family: var(--font-head); font-size: 18px; }
  .modal p { margin: 0; color: var(--muted); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }

  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .info-grid { grid-template-columns: minmax(0, 1fr); }
    .add-form { grid-template-columns: 1fr 1fr; }
    .add-form .input:first-child { grid-column: 1 / -1; }
    .top-inner { gap: 8px; }
    .tab { padding: 7px 9px; gap: 5px; }
    .brand { font-size: 16px; }
    .sync > span { display: none; }
  }
</style>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">ToDo <span class="sync" id="sync"><i></i><span>Nur auf diesem Gerät</span></span></div>
    <nav class="tabs">
      <button class="tab beruf" data-go="#beruflich">💼 Beruflich <span class="count" id="cnt-beruf">0</span></button>
      <button class="tab privat" data-go="#privat">🏠 Privat <span class="count" id="cnt-privat">0</span></button>
    </nav>
    <button class="menu-btn" id="menuBtn" title="Daten" aria-haspopup="true">⋯</button>
    <div class="menu" id="menu" hidden>
      <button id="exportBtn">Backup speichern (JSON)</button>
      <button id="importBtn">Backup einspielen</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <div class="note" id="menuNote"></div>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
/* =========================================================
   Daten & Konfiguration
   ========================================================= */
const STORAGE_KEY = 'todoapp.v1';

const PLAYERS = [
  ['Eric Maxim', 'Choupo-Moting'], ['Noah', 'Katterbach'], ['Umut', 'Tohumcu'], ['Kelven', 'Frees'],
  ['Franjo', 'Ivanovic'], ['Bambasé', 'Conté'], ['Fisnik', 'Asllani'], ['Noah', 'Wagner'],
  ['Guilherme', 'Ramos'], ['Elias', 'Benkara'], ['David', 'Wurie'], ['Rayan', 'Zidane'],
  ['Salvatore', 'Mule'], ['Yasin', 'Chebil'], ['Raif', 'Adam'], ['Malik', 'Kassassir'], ['Piet', 'Scobel'],
];

const AREAS = [
  { key: 'versicherung', label: 'Versicherungen', short: 'Vers.', icon: '🛡️', fields: [
    ['kranken', 'Krankenversicherung'], ['haftpflicht', 'Haftpflicht'],
    ['bu', 'Berufsunfähigkeit / Sportinvalidität'], ['hausrat', 'Hausrat'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'wohnung', label: 'Wohnung', short: 'Whg.', icon: '🏢', fields: [
    ['status', 'Status (Miete / Eigentum / Suche)'], ['vermieter', 'Vermieter / Makler'],
    ['miete', 'Miete / Kosten'], ['vertrag', 'Vertragsbeginn / Kündigungsfrist'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'adresse', label: 'Adresse & Kontakt', short: 'Adr.', icon: '📍', fields: [
    ['strasse', 'Straße & Hausnr.'], ['ort', 'PLZ & Ort'], ['telefon', 'Telefon'], ['email', 'E-Mail'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'steuer', label: 'Steuer', short: 'Steuer', icon: '🧾', fields: [
    ['berater', 'Steuerberater'], ['steuerid', 'Steuer-ID'], ['finanzamt', 'Finanzamt'],
    ['erklaerung', 'Letzte Steuererklärung'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'auto', label: 'Auto', short: 'Auto', icon: '🚗', fields: [
    ['fahrzeug', 'Fahrzeug'], ['kennzeichen', 'Kennzeichen'], ['vertrag', 'Leasing / Kauf (bis)'],
    ['tuev', 'TÜV / Service fällig'], ['notiz', 'Notizen', 'area'] ] },
  { key: 'familie', label: 'Familie', short: 'Fam.', icon: '👨‍👩‍👧', fields: [
    ['partner', 'Partner/in'], ['kinder', 'Kinder'], ['eltern', 'Eltern / Angehörige'],
    ['notfall', 'Notfallkontakt'], ['notiz', 'Notizen', 'area'] ] },
];
const PLAYER_CATS = [{ key: 'allgemein', label: 'Allgemein', icon: '📌' }, ...AREAS];

const PRIVATE_CATS = [
  { key: 'haushalt', label: 'Haushalt', icon: '🧹' },
  { key: 'finanzen', label: 'Finanzen', icon: '💶' },
  { key: 'gesundheit', label: 'Gesundheit & Sport', icon: '💪' },
  { key: 'familie', label: 'Familie & Freunde', icon: '❤️' },
  { key: 'termine', label: 'Termine', icon: '📅' },
  { key: 'einkauf', label: 'Einkaufen', icon: '🛒' },
  { key: 'sonstiges', label: 'Sonstiges', icon: '✨' },
];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function newPlayer(first, last) {
  return { id: slug(first + ' ' + last) || uid(), first, last, info: {}, todos: [] };
}
function defaultState() {
  return { players: PLAYERS.map(([f, l]) => newPlayer(f, l)), privat: { todos: [] } };
}
function normalize(s) {
  s.players = (s.players || []).filter(p => p && p.id);
  s.players.forEach(p => {
    p.first = p.first || ''; p.last = p.last || '';
    p.info = p.info || {};
    AREAS.forEach(a => { p.info[a.key] = Object.assign(Object.fromEntries(a.fields.map(([k]) => [k, ''])), p.info[a.key] || {}); });
    p.todos = Array.isArray(p.todos) ? p.todos : [];
  });
  s.privat = s.privat || {};
  s.privat.todos = Array.isArray(s.privat.todos) ? s.privat.todos : [];
  return s;
}

let state;
function loadLocal() {
  let s = null;
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  state = normalize(s || defaultState());
}
function storeLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function save() { storeLocal(); updateCounts(); scheduleSync(); }

/* =========================================================
   Synchronisation über das Claude-Konto (db-Capability)
   Alles liegt im privaten Bereich data/users/<id>/ – nur du siehst ihn:
   meta (Spieler-Reihenfolge), privat (private Todos), p_<spieler> je Spieler
   ========================================================= */
const sync = { coll: null, saved: {}, ready: false, writing: false, again: false, timer: null, pendingRender: false };

function setSync(kind, text) {
  const el = document.getElementById('sync');
  el.className = 'sync ' + kind;
  el.lastElementChild.textContent = text;
  el.title = text;
}
function docsFromState() {
  const d = { meta: { order: state.players.map(p => p.id) }, privat: { todos: state.privat.todos } };
  state.players.forEach(p => { d['p_' + p.id] = p; });

}
function stateFromDocs(docs) {
  const order = (docs.meta && docs.meta.order) || [];
  const extra = Object.keys(docs).filter(k => k.startsWith('p_')).map(k => k.slice(2)).filter(id => !order.includes(id));
  const players = [...order, ...extra].map(id => docs['p_' + id]).filter(Boolean).map(p => structuredClone(p));
  return normalize({ players, privat: structuredClone(docs.privat || { todos: [] }) });
}
function scheduleSync() {
  if (!sync.ready) return;
  setSync('busy', 'Speichert …');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(flush, 500);
}
async function flush() {
  if (!sync.ready) return;
  if (sync.writing) { sync.again = true; return; }
  sync.writing = true;
  try {
    do {
      sync.again = false;
      const local = docsFromState();
      const keys = new Set([...Object.keys(local), ...Object.keys(sync.saved)]);
      for (const k of keys) {
        const j = local[k] ? JSON.stringify(local[k]) : undefined;
        if (j === sync.saved[k]) continue;
        const ref = sync.coll.doc(k);
        if (j === undefined) { await ref.delete(); delete sync.saved[k]; }
        else { await ref.set(JSON.parse(j)); sync.saved[k] = j; }
      }
    } while (sync.again);
    setSync('ok', 'Synchronisiert');
  } catch (e) {
    console.error(e);
    setSync('err', e && e.code === 'quota_exceeded' ? 'Speicher voll – nicht gespeichert' : 'Nicht gespeichert – neuer Versuch …');
    setTimeout(scheduleSync, 4000);
  } finally { sync.writing = false; }
}
function applyRemote(snap) {
  const remote = {};
  snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });

  if (!sync.ready) {
    if (snap.metadata.fromCache) return;            // auf verbindliche Antwort warten
    sync.ready = true;
    clearTimeout(sync.loadTimer);
    if (!Object.keys(remote).length) {               // erster Start: Stand dieses Geräts hochladen
      sync.saved = {};
      setSync('busy', 'Speichert …');
      flush();
      return;
    }
    state = stateFromDocs(remote);
    sync.saved = {};
    Object.keys(remote).forEach(k => { sync.saved[k] = JSON.stringify(remote[k]); });
    storeLocal();
    setSync('ok', 'Synchronisiert');
    updateCounts(); safeRender();
    scheduleSync();                                  // schreibt nur, falls etwas fehlt
    return;
  }

  // Änderungen von anderen Geräten einarbeiten – eigene, noch nicht gespeicherte bleiben erhalten
  const local = docsFromState();
  const merged = {};
  let changed = false;
  for (const k of new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(sync.saved)])) {
    const lj = local[k] ? JSON.stringify(local[k]) : undefined;
    const rj = remote[k] ? JSON.stringify(remote[k]) : undefined;
    if (lj !== sync.saved[k]) { if (local[k]) merged[k] = local[k]; continue; }
    if (rj !== lj) changed = true;
    if (remote[k]) { merged[k] = remote[k]; sync.saved[k] = rj; } else delete sync.saved[k];
  }
  if (!changed) return;
  state = stateFromDocs(merged);
  storeLocal(); updateCounts(); safeRender();
}
async function startSync() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) {}
  if (!db || !user) { setSync('', 'Nur auf diesem Gerät'); return; }
  const id = await user.id().catch(() => null);
  if (!id) { setSync('', 'Nicht angemeldet – nur auf diesem Gerät'); return; }
  sync.coll = db.collection('data/users/' + id);
  setSync('busy', 'Verbinde …');
  sync.loadTimer = setTimeout(() => { if (!sync.ready) setSync('err', 'Keine Verbindung – zeigt Stand dieses Geräts'); }, 10000);
  sync.coll.onSnapshot(applyRemote, e => {
    console.error(e);
    clearTimeout(sync.loadTimer);
    sync.ready = false;
    setSync('err', 'Sync unterbrochen – Seite neu öffnen');
  });
}

const typing = () => { const a = document.activeElement; return a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function safeRender() { if (typing()) { sync.pendingRender = true; return; } render(); }

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function dueInfo(due) {
  if (!due) return null;
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - today()) / 86400000);
  let label;
  if (diff === 0) label = 'Heute';
  else if (diff === 1) label = 'Morgen';
  else if (diff === -1) label = 'Gestern';
  else label = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: Math.abs(diff) > 300 ? '2-digit' : undefined });
  return { diff, label, cls: diff < 0 ? 'over' : diff <= 3 ? 'soon' : '' };
}
const isOverdue = t => !t.done && t.due && dueInfo(t.due).diff < 0;
const isThisWeek = t => !t.done && t.due && (d => d >= 0 && d <= 7)(dueInfo(t.due).diff);
function sortTodos(list) {
  return [...list].sort((a, b) => {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    if (!!a.prio !== !!b.prio) return a.prio ? -1 : 1;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1; if (b.due) return 1;
    return (b.created || 0) - (a.created || 0);
  });
}
const COLORS = ['#2457d6', '#7c3aed', '#c0266d', '#d4570b', '#0b7f9a', '#1f8a4c', '#a87400', '#4f46e5', '#0d8577', '#b4233c'];
function colorFor(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const initials = p => ((p.first[0] || '') + (p.last[0] || '')).toUpperCase();
const avatar = p => `<div class="avatar" style="background:${colorFor(p.id)}">${esc(initials(p))}</div>`;
const fullName = p => `${p.first} ${p.last}`.trim();
function areaStatus(p, a) {
  const keys = a.fields.filter(f => f[2] !== 'area').map(f => f[0]);
  const filled = keys.filter(k => (p.info[a.key][k] || '').trim()).length;
  return { filled, total: keys.length, cls: filled === 0 ? '' : filled === keys.length ? 'full' : 'part' };
}
const openCount = list => list.filter(t => !t.done).length;
const findPlayer = id => state.players.find(p => p.id === id);
const allPlayerTodos = () => state.players.flatMap(p => p.todos.map(t => ({ ...t, player: p })));

/* ---------- Dialoge (statt prompt/confirm) ---------- */
function dialog({ title, text = '', fields = [], ok = 'OK', danger = false, cancel = true }) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<form class="modal" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
      ${fields.map((f, i) => `<div class="field"><label for="dlg-${i}">${esc(f.label)}</label><input class="input" id="dlg-${i}" name="${f.name}" value="${esc(f.value || '')}" ${f.required ? 'required' : ''} autocomplete="off"></div>`).join('')}
      <div class="actions">${cancel ? '<button type="button" class="btn ghost" data-cancel>Abbrechen</button>' : ''}<button type="submit" class="btn ${danger ? 'danger-fill' : 'primary'}">${esc(ok)}</button></div>
    </form>`;
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('click', e => { if (e.target === back) close(null); });
    const c = back.querySelector('[data-cancel]'); if (c) c.onclick = () => close(null);
    back.querySelector('form').onsubmit = e => { e.preventDefault(); close(fields.length ? Object.fromEntries(new FormData(e.target)) : true); };
    document.body.appendChild(back);
    (back.querySelector('input') || back.querySelector('[type=submit]')).focus();
  });
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;

}

    if (!t) return;
    li.querySelector('input[type=checkbox]').onchange = e => { t.done = e.target.checked; t.doneAt = t.done ? Date.now() : null; save(); render(); };
    li.querySelector('[data-del]').onclick = () => { arr.splice(arr.indexOf(t), 1); save(); render(); };
    const txt = li.querySelector('.todo-text');
    txt.ondblclick = () => {
      txt.innerHTML = `<input class="edit-input" id="edit-${esc(t.id)}" value="${esc(t.text)}">`;
      const inp = txt.querySelector('input'); inp.focus(); inp.select();
      const commit = () => { const v = inp.value.trim(); if (v && v !== t.text) { t.text = v; save(); } render(); };
      inp.onblur = commit;
      inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.onblur = null; render(); } };
    };
  });
}

/* =========================================================
   Router (#beruflich, #privat, #s-<spieler>)
   ========================================================= */
let lastRoute = null;
function render() {
  sync.pendingRender = false;
  const h = location.hash || '#beruflich';
  const route = h.startsWith('#s-') ? 'spieler' : h === '#privat' ? 'privat' : 'beruflich';
  const changed = h !== lastRoute;
  if (changed) { ui.filter = 'offen'; ui.cat = 'alle'; Object.keys(openCards).forEach(k => delete openCards[k]); }
  lastRoute = h;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', (route === 'privat') === t.classList.contains('privat')));

  if (route === 'spieler') renderPlayer(decodeURIComponent(h.slice(3)));
  else if (route === 'privat') renderPrivat();
  else renderBeruflich();
  if (changed) window.scrollTo(0, 0);
}
function updateCounts() {
  document.getElementById('cnt-beruf').textContent = openCount(allPlayerTodos());
  document.getElementById('cnt-privat').textContent = openCount(state.privat.todos);
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
window.addEventListener('hashchange', render);

/* ---------- Menü: Backup ---------- */
const menu = document.getElementById('menu');
document.getElementById('menuBtn').onclick = e => {
  e.stopPropagation();
  document.getElementById('menuNote').textContent = sync.ready
    ? 'Deine Daten liegen privat in deinem Claude-Konto und sind auf Handy und Laptop gleich.'
    : 'Daten liegen nur in diesem Browser. Mit einem Backup lassen sie sich auf ein anderes Gerät übertragen.';
  menu.hidden = !menu.hidden;
};
document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.hidden = true; });
document.getElementById('exportBtn').onclick = async () => {
  menu.hidden = true;
  const filename = `todo-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const data = JSON.stringify(state, null, 2);
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data }); } catch (e) { if (e && e.code !== 'dismissed') toast('Backup konnte nicht gespeichert werden'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById('importBtn').onclick = () => { menu.hidden = true; document.getElementById('importFile').click(); };
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (!Array.isArray(data.players)) throw new Error(); }
  catch { await dialog({ title: 'Datei nicht lesbar', text: 'Das ist kein gültiges Backup dieser App.', ok: 'OK', cancel: false }); return; }
  const ok = await dialog({ title: 'Backup einspielen?', text: `Die aktuellen Daten werden durch das Backup ersetzt (${data.players.length} Spieler).`, ok: 'Ersetzen', danger: true });
  if (!ok) return;
  state = normalize(data); save(); render(); toast('Backup eingespielt');
};

loadLocal(); updateCounts(); render(); startSync();
</script>
